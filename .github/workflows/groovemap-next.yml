name: GrooveMap Next

on:
  pull_request:
    paths:
      - "groovemap_next/**"
      - ".github/workflows/groovemap-next.yml"
  push:
    branches:
      - "feat/suno-midi-tempo-v2"
      - "feat/groove-humanize-v3"
    paths:
      - "groovemap_next/**"
      - ".github/workflows/groovemap-next.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core + test dependencies
        run: python -m pip install -e "./groovemap_next[dev]"
      - name: Compile
        run: python -m compileall -q groovemap_next/groovemap_next
      - name: Tests
        run: pytest -q groovemap_next/tests
