[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groovemap-next"
version = "0.1.0"
description = "SUNO stem -> drum MIDI -> variable tempo map pipeline for GrooveMap"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26",
  "mido>=1.3.3",
]

[project.optional-dependencies]
ai = [
  "beat-this>=1.1.0",
]
dev = [
  "pytest>=8",
]

[project.scripts]
groovemap-next = "groovemap_next.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["groovemap_next*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
